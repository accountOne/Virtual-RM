# Render Blueprint — deploys the backend only (server/). The frontend is deployed
# separately to GitHub Pages via .github/workflows/deploy-pages.yml.
#
# To use: on https://dashboard.render.com choose "New +" -> "Blueprint", connect
# this GitHub repo, and Render will read this file automatically. Free plan spins
# down after ~15 minutes of inactivity — the first request after idle takes
# 30-60s to wake up (fine for demo/testing, not for a live presentation).
#
# After it deploys, copy the service's https://<name>.onrender.com URL into the
# API_URL repository variable (Settings -> Secrets and variables -> Actions ->
# Variables) and re-run the "Deploy frontend to GitHub Pages" workflow.

services:
  - type: web
    name: virtual-rm-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      # Login & Session Security upgrade — see docs/security/csrf-cors.md. Without this,
      # server/src/app.ts falls back to a dev-only default (localhost:4200 + this repo's own
      # known GitHub Pages origin as a safety net) — set it explicitly here so CORS is correct
      # for whatever GitHub Pages URL actually serves the frontend, no code change needed if
      # that ever moves to a custom domain.
      - key: ALLOWED_ORIGINS
        value: https://accountone.github.io
      # This service is served over HTTPS by Render — unlike local dev (plain HTTP), a Secure
      # cookie works correctly here and should be required. Secure is also mandatory for
      # SameSite=None below (browsers reject that combination without it).
      - key: COOKIE_SECURE
        value: "true"
      # accountone.github.io and virtual-rm-api.onrender.com are different registrable domains —
      # a genuinely cross-SITE deployment, not just cross-origin-same-site. SameSite=Lax (this
      # app's local-dev default) is NEVER sent by the browser on cross-site fetch/XHR requests
      # (only on top-level navigations), so every authenticated API call after login would
      # silently lose its cookie and 401 — this was the actual cause of a blank dashboard after
      # an otherwise-successful login. SameSite=None restores normal cookie behavior for this
      # topology; CSRF protection still holds independently via the token itself (see
      # docs/security/csrf-cors.md), which this app was already designed not to rely on
      # SameSite alone for.
      - key: COOKIE_SAME_SITE
        value: none
