# Render Blueprint — builds and serves BOTH the Angular frontend and the Express backend from
# this one service, same origin. This replaced an earlier split deployment (Angular on GitHub
# Pages, API here) after discovering that split deployment doesn't work reliably: GitHub Pages
# and Render are different registrable domains, so the session cookie was a third-party cookie
# from the browser's point of view — Safari's Intelligent Tracking Prevention blocks that by
# default regardless of any SameSite/Secure cookie attribute (confirmed live: the backend
# responded correctly to every request when tested directly, but a real browser never sent the
# cookie back). Serving everything from one origin removes the problem at the root instead of
# working around a browser policy that keeps getting stricter across browsers.
#
# To use: on https://dashboard.render.com choose "New +" -> "Blueprint", connect this GitHub
# repo, and Render will read this file automatically. Free plan spins down after ~15 minutes of
# inactivity — the first request after idle takes 30-60s to wake up (fine for demo/testing, not
# for a live presentation). No `API_URL`/GitHub Pages step needed anymore — this service's own
# URL (https://<name>.onrender.com) is the whole app.

services:
  - type: web
    name: virtual-rm-api
    runtime: node
    plan: free
    # No `rootDir` — the build needs to run at the repo root (Angular) *and* in server/
    # (Express), so both commands below use explicit relative paths instead.
    buildCommand: npm install && npm run build && cd server && npm install && npm run build
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      # This service is served over HTTPS by Render — unlike local dev (plain HTTP), a Secure
      # cookie works correctly here and should be required.
      - key: COOKIE_SECURE
        value: "true"
      # ALLOWED_ORIGINS / COOKIE_SAME_SITE deliberately left unset now that the frontend is
      # served from this same origin — same-origin requests aren't subject to CORS at all, and
      # the default COOKIE_SAME_SITE=lax (server/src/auth/session.middleware.ts) is the more
      # secure choice once cross-site isn't a requirement. See docs/security/csrf-cors.md for
      # the cross-site notes, kept for reference in case a split deployment is ever needed again.
