<div class="min-h-screen flex flex-col bg-ink-50" *ngIf="auth.isAuthenticated(); else guestOutlet">
  <app-header (menuToggle)="mobileMenuOpen.set(true)" />

  <div class="flex flex-1 min-h-0">
    <app-sidebar [open]="mobileMenuOpen()" (close)="mobileMenuOpen.set(false)" />

    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>

  <app-toast-container />
  <app-confirm-dialog />
  <app-rm-chat-launcher />
</div>

<ng-template #guestOutlet>
  <router-outlet />
  <app-toast-container />
</ng-template>
