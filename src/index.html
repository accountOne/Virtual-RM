<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>MSB Business Banking — Virtual RM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nền tảng demo Virtual Relationship Manager cho Digital Business Banking">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap">
  <!-- Restores the real path GitHub Pages' 404.html redirect trick encoded into
       the query string, before Angular's router boots. No-op on any other host. -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
</head>
<body class="font-sans antialiased bg-ink-50 text-ink-800">
  <app-root></app-root>
</body>
</html>
